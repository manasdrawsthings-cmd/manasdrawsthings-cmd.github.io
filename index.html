<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    padding: 60px 20px;
    background: #fdf6f0;
    color: #333;
  }
  h1 {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #4a3b32;
    margin-bottom: 10px;
  }
  p.subtitle {
    font-size: 16px;
    color: #8a7a70;
    margin-top: 0;
    margin-bottom: 40px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-top: 40px;
    flex-wrap: wrap;
  }
  .item {
    cursor: pointer;
    border: none;
    background: none;
    transition: transform 0.15s ease;
  }
  .item:active {
    transform: scale(0.96);
  }
  .soap {
    width: 220px;
    height: 140px;
    background: linear-gradient(145deg, #f9b8d0, #f28cae);
    border-radius: 24px;
    box-shadow: 0 6px 14px rgba(230,120,160,0.35), inset 0 0 20px rgba(255,255,255,0.3);
  }
  .powder {
    width: 220px;
    height: 170px;
    background: linear-gradient(145deg, #f5ead2, #e8d7ae);
    border-radius: 50% 50% 45% 45%;
    box-shadow: 0 6px 14px rgba(180,150,90,0.3), inset 0 -14px 20px rgba(200,180,140,0.5);
  }
  .item p {
    margin-top: 14px;
    font-size: 18px;
    font-weight: 500;
    color: #5a4a40;
  }
  .price {
    margin-top: 40px;
    font-size: 32px;
    font-weight: 700;
    color: #2f2f2f;
    min-height: 45px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<h1>Natural Skincare, Made With Care</h1>
<p class="subtitle">Handcrafted soaps and face powders for every skin type</p>

<div class="buttons">
  <button class="item" onclick="showPrice('soap')">
    <div class="soap"></div>
    <p>Soap</p>
  </button>
  <button class="item" onclick="showPrice('powder')">
    <div class="powder"></div>
    <p>Face Powder</p>
  </button>
</div>

<div class="price" id="priceBox"></div>

<script>
function showPrice(type) {
  const box = document.getElementById('priceBox');
  if (type === 'soap') {
    box.innerText = "Any soap — ₹100";
  } else {
    box.innerText = "100
