<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
    background: #fdf6f0;
  }
  h1 { color: #333; }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 40px;
    flex-wrap: wrap;
  }
  .item {
    cursor: pointer;
    border: none;
    background: none;
  }
  .soap {
    width: 80px;
    height: 50px;
    background: #f7a8c4;
    border-radius: 12px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
  }
  .powder {
    width: 80px;
    height: 60px;
    background: #f0e6d2;
    border-radius: 50% 50% 45% 45%;
    box-shadow: inset 0 -8px 10px rgba(200,180,140,0.6);
  }
  .price {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #444;
    min-height: 30px;
  }
</style>
</head>
<body>

<h1>Hello, my website is live!</h1>

<div class="buttons">
  <button class="item" onclick="showPrice('soap')">
    <div class="soap"></div>
    <p>Soap</p>
  </button>
  <button class="item" onclick="showPrice('powder')">
    <div class="powder"></div>
    <p>Face Powder</p>
  </button>
</div>

<div class="price" id="priceBox"></div>

<script>
function showPrice(type) {
  const box = document.getElementById('priceBox');
  if (type === 'soap') {
    box.innerText = "Any soap = ₹100";
  } else {
    box.innerText = "100g = ₹200";
  }
}
</script>

</body>
</html>
