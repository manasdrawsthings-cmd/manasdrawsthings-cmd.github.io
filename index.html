<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    padding: 60px 20px;
    background: #fdf6f0;
    color: #333;
  }
  h1 {
    font-size: 38px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #4a3b32;
    margin-bottom: 10px;
  }
  p.subtitle {
    font-size: 17px;
    color: #8a7a70;
    margin-top: 0;
    margin-bottom: 50px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 70px;
    flex-wrap: wrap;
  }
  .item {
    cursor: pointer;
    border: none;
    background: none;
    transition: transform 0.15s ease;
  }
  .item:active {
    transform: scale(0.96);
  }
  .item.selected .soap,
  .item.selected .powder {
    outline: 3px solid #c98a5e;
    outline-offset: 4px;
  }

  .soap {
    width: 260px;
    height: 160px;
    background: linear-gradient(145deg, #f9b8d0, #f28cae);
    border-radius: 28px;
    box-shadow: 0 8px 16px rgba(230,120,160,0.35), inset 0 0 25px rgba(255,255,255,0.35);
  }

  .powder {
    width: 260px;
    height: 190px;
    position: relative;
    background: radial-gradient(ellipse at center, #fbf3e2 0%, #e9d7ad 90%);
    border-radius: 50% 50% 45% 45%;
    box-shadow: 0 8px 16px rgba(180,150,90,0.3);
    overflow: hidden;
  }
  .powder::before {
    content: "";
    position: absolute;
    top: 15%;
    left: 10%;
    width: 80%;
    height: 40%;
    background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
  }
  .powder::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1.5px),
      radial-gradient(circle, rgba(180,150,100,0.25) 1px, transparent 1.5px);
    background-size: 14px 14px, 20px 20px;
    background-position: 0 0, 7px 10px;
  }

  .item p {
    margin-top: 16px;
    font-size: 19px;
    font-weight: 500;
    color: #5a4a40;
  }

  .order-box {
    margin-top: 50px;
    font-size: 20px;
    color: #2f2f2f;
  }
  .qty-controls {
    display: inline-flex;
    align-items: center;
    gap: 15px;
    margin-top: 15px;
  }
  .qty-controls button {
    width: 40px;
    height: 40px;
    font-size: 22px;
    border: none;
    border-radius: 50%;
    background: #c98a5e;
    color: white;
    cursor: pointer;
  }
  .qty-controls span {
    font-size: 22px;
    font-weight: 600;
    min-width: 30px;
  }
  .total {
    margin-top: 25px;
    font-size: 30px;
    font-weight: 700;
    color: #2f2f2f;
    min-height: 40px;
  }
</style>
</head>
<body>

<h1>Natural Skincare, Made With Care</h1>
<p class="subtitle">Handcrafted soaps and face powders for every skin type</p>

<div class="buttons">
  <button class="item" id="soapBtn" onclick="selectProduct('soap')">
    <div class="soap"></div>
    <p>Soap</p>
  </button>
  <button class="item" id="powderBtn" onclick="selectProduct('powder')">
    <div class="powder"></div>
    <p>Face Powder</p>
  </button>
</div>

<div class="order-box" id="orderBox" style="display:none;">
  <div id="unitPriceText"></div>
  <div class="qty-controls">
    <button onclick="changeQty(-1)">−</button>
    <span id="qtyDisplay">1</span>
    <button onclick="changeQty(1)">+</button>
  </div>
  <div class="total" id="totalText"></div>
</div>

<script>
let selected = null;
let qty = 1;

const prices = {
  soap: 100,
  powder: 200
};

const unitLabels = {
  soap: "₹100 per soap",
  powder: "₹200 per 100g"
};

function selectProduct(type) {
  selected = type;
  qty = 1;

  document.getElementById('soapBtn').classList.remove('selected');
  document.getElementById('powderBtn').classList.remove('selected');
  document.getElementById(type + 'Btn').classList.add('selected');

  document.getElementById('orderBox').style.display = 'block';
  document.getElementById('unitPriceText').innerText = unitLabels[type];
  document.getElementById('qtyDisplay').innerText = qty;
  updateTotal();
}

function changeQty(delta) {
  if (!selected) return;
  qty = Math.max(1, qty + delta);
  document.getElementById('qtyDisplay').innerText = qty;
  updateTotal();
}

function updateTotal() {
  if (!selected) return;
  const total = prices[selected] * qty;
  const unitName = selected === 'soap' ? 'soap(s)' : 'x 100g';
  document.getElementById('totalText').innerText = "Total: ₹" + total;
}
</script>

</body>
</html>
